name: Agent 6 Concurrence
on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  concurrence-veille:
    runs-on: ubuntu-latest
    steps:
      - name: Set date
        id: date
        run: echo "today=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT
      - name: Install deps
        run: python3 -m pip install --upgrade pip && pip install requests beautifulsoup4
      - name: Analyse concurrents
        run: |
          mkdir -p /tmp/concurrence
          python3 << 'PYEOF'
          import urllib.request, ssl, json, re
          from html.parser import HTMLParser
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE
          DATE = "$(date -u +%Y-%m-%d)"
          CONCURRENTS = [
              {"name": "Oura Ring", "url": "https://ouraring.com/fr", "type": "Bague connectee"},
              {"name": "Circular Ring", "url": "https://circular.xyz/fr", "type": "Bague connectee"},
              {"name": "Whoop", "url": "https://www.whoop.com", "type": "Bracelet recuperation"},
              {"name": "Withings", "url": "https://www.withings.com/fr/fr/", "type": "Sante connectee"},
              {"name": "Garmin Health", "url": "https://www.garmin.com/fr-FR/", "type": "Sport connecte"},
          ]
          class TitleParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_title = False
                  self.title = ""
              def handle_starttag(self, tag, attrs):
                  if tag == "title": self.in_title = True
              def handle_data(self, data):
                  if self.in_title: self.title += data
              def handle_endtag(self, tag):
                  if tag == "title": self.in_title = False
          results = []
          for conc in CONCURRENTS:
              try:
                  req = urllib.request.Request(conc["url"], headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, context=ctx, timeout=15) as r:
                      content = r.read().decode("utf-8", errors="ignore")
                  parser = TitleParser()
                  parser.feed(content)
                  desc_match = re.search(r'<meta\s+name="description"\s+content="([^"]+)"', content)
                  desc = desc_match.group(1)[:200] if desc_match else "N/A"
                  product_count = len(re.findall(r'class="[^"]*product[^"]*"', content, re.IGNORECASE))
                  has_blog = "/blog" in content.lower() or "/blog/" in content.lower()
                  has_faq = "faq" in content.lower()
                  results.append({"name": conc["name"], "type": conc["type"], "url": conc["url"], "title": parser.title.strip()[:100], "description": desc, "products_detected": product_count, "has_blog": has_blog, "has_faq": has_faq})
                  print(f"OK {conc['name']}: {product_count} produits, blog={has_blog}, faq={has_faq}")
              except Exception as e:
                  print(f"ERR {conc['name']}: {str(e)[:80]}")
                  results.append({"name": conc["name"], "type": conc["type"], "url": conc["url"], "error": str(e)[:100]})
          report = f"# Veille Concurrence - SynchroVie\n\nDate : {DATE}\nConcurrents : {len(results)}\n\n"
          for r in results:
              report += f"## {r['name']} ({r['type']})\n- URL : {r['url']}\n"
              if 'title' in r:
                  report += f"- Title : {r['title']}\n- Desc : {r['description']}\n- Produits : {r['products_detected']}\n- Blog : {'OUI' if r['has_blog'] else 'NON'}\n- FAQ : {'OUI' if r['has_faq'] else 'NON'}\n\n"
              else:
                  report += f"- Erreur : {r.get('error', 'N/A')}\n\n"
          report += "## Recommandations\n- Comparer prix\n- Identifier fonctionnalites manquantes\n- Analyser contenu\n"
          with open("/tmp/concurrence/rapport.txt", "w", encoding="utf-8") as f:
              f.write(report)
          print(f"Rapport genere : {len(results)} concurrents")
          PYEOF
          cat /tmp/concurrence/rapport.txt
      - name: Send via Brevo email
        env:
          BREVO_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          DATE="${{ steps.date.outputs.today }}"
          REPORT=$(cat /tmp/concurrence/rapport.txt)
          curl -s -X POST "https://api.brevo.com/v3/smtp/email" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -H "api-key: $BREVO_KEY" \
            -d '{"sender":{"email":"synchrovie@gmail.com","name":"SynchroVie Concurrence"},"to":[{"email":"diougamady96@gmail.com"}],"subject":"Veille Concurrence - '"$DATE"'","htmlContent":"<html><body><h1>Veille Concurrence</h1><pre>'"$(echo "$REPORT" | head -200)"'</pre></body></html>"}'
          echo "Email envoye"
