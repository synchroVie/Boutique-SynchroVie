name: Agent 4 — Content Freshener

# Déclencheur : chaque mercredi 9h UTC (= 9h Bamako) + manuel
# Objectif : actualiser 1 article blog ancien par semaine pour booster SEO
on:
  schedule:
    - cron: '0 9 * * 3'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # Récupérer tout l'historique pour les dates de commit

      - name: Set date
        id: date
        run: echo "today=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Identify oldest blog article
        id: target
        run: |
          set -e
          # Pour chaque article blog, trouver la date du dernier commit qui l'a modifié
          OLDEST_FILE=""
          OLDEST_DATE=""
          OLDEST_DAYS=0

          TODAY=$(date -u +%s)

          for f in blog/*.html; do
            [ -f "$f" ] || continue
            # Date du dernier commit sur ce fichier
            LAST_COMMIT_DATE=$(git log -1 --format="%ct" -- "$f" 2>/dev/null || echo "0")
            if [ "$LAST_COMMIT_DATE" -eq 0 ]; then
              DAYS=$(( (TODAY - 0) / 86400 ))
            else
              DAYS=$(( (TODAY - LAST_COMMIT_DATE) / 86400 ))
            fi

            if [ "$DAYS" -gt "$OLDEST_DAYS" ]; then
              OLDEST_DAYS=$DAYS
              OLDEST_FILE=$f
              OLDEST_DATE=$(git log -1 --format="%ci" -- "$f" 2>/dev/null | cut -d' ' -f1)
            fi
          done

          echo "file=$OLDEST_FILE" >> $GITHUB_OUTPUT
          echo "last_modified=$OLDEST_DATE" >> $GITHUB_OUTPUT
          echo "days_old=$OLDEST_DAYS" >> $GITHUB_OUTPUT

          echo "🎯 Article le plus ancien : $OLDEST_FILE"
          echo "📅 Dernière modification : $OLDEST_DATE (il y a $OLDEST_DAYS jours)"

      - name: Skip if too recent
        if: steps.target.outputs.days_old < 14
        run: |
          echo "✅ Tous les articles ont été modifiés récemment (moins de 14 jours). Skip."
          exit 0

      - name: Generate update brief
        env:
          TARGET_FILE: ${{ steps.target.outputs.file }}
          LAST_MOD: ${{ steps.target.outputs.last_modified }}
          TODAY: ${{ steps.date.outputs.today }}
        run: |
          mkdir -p drafts/refresh
          
          # Extraire le titre de l'article cible
          TITLE=$(grep -oE '<title>[^<]+</title>' "$TARGET_FILE" | head -1 | sed 's/<[^>]*>//g')
          DESC=$(grep -oE '<meta name="description" content="[^"]+"' "$TARGET_FILE" | head -1 | sed 's/.*content="//;s/"$//')

          FILENAME=$(basename "$TARGET_FILE" .html)
          
          {
            echo "# Brief d'Actualisation — ${TODAY}"
            echo ""
            echo "## Article à actualiser"
            echo "- **Fichier** : \`${TARGET_FILE}\`"
            echo "- **Titre actuel** : ${TITLE}"
            echo "- **Description actuelle** : ${DESC}"
            echo "- **Dernière modification** : ${LAST_MOD}"
            echo ""
            echo "## Tâche d'actualisation"
            echo ""
            echo "Cet article n'a pas été modifié depuis plus de 14 jours. Pour maintenir"
            echo "le signal 'freshness' SEO, il faut l'actualiser."
            echo ""
            echo "### Actions à effectuer"
            echo "1. **Ajouter un paragraphe 'Mise à jour ${TODAY}'** en haut de l'article (juste après l'intro)"
            echo "   - Mentionner une donnée récente (étude 2025-2026, statistique marché)"
            echo "   - 150-200 mots maximum"
            echo "   - Format : \`<aside class=\"update-notice\">...</aside>\`"
            echo ""
            echo "2. **Vérifier et mettre à jour les liens externes**"
            echo "   - Identifier les liens morts (404)"
            echo "   - Remplacer par des sources équivalentes récentes"
            echo ""
            echo "3. **Mettre à jour les chiffres/datess** dans le corps"
            echo "   - Si l'article mentionne 'en 2024', mettre 'en 2026'"
            echo "   - Si une étude de 2022 est citée, vérifier s'il existe une version 2025"
            echo ""
            echo "4. **Mettre à jour le lastmod dans sitemap.xml**"
            echo "   - Automatique via Agent 3"
            echo ""
            echo "5. **Mettre à jour le JSON-LD Article**"
            echo "   - Ajouter \`dateModified: \"${TODAY}\"\`"
            echo ""
            echo "## Workflow"
            echo "1. GLM (moi) génère ce brief automatiquement"
            echo "2. Tu copies le brief + le contenu actuel de l'article → Claude"
            echo "3. Claude propose la version actualisée"
            echo "4. Tu colles le résultat final dans l'article"
            echo "5. Commit + push"
            echo ""
            echo "## Rappel des règles éditoriales SynchroVie"
            echo "- Mots interdits : Découvrez, Révolutionnaire, N'attendez plus, Optimisez votre, etc."
            echo "- Ton : humain, professionnel, jamais commercial agressif"
            echo "- Douleur avant promesse"
            echo "- Sources scientifiques citées [1], [2]"
            echo ""
            echo "## À faire manuellement après réception du résultat Claude"
            echo "- [ ] Vérifier que le format HTML est conforme aux autres articles"
            echo "- [ ] Vérifier les liens internes (vers produits SynchroVie)"
            echo "- [ ] Mettre à jour \`dateModified\` dans le JSON-LD"
            echo "- [ ] Tester la page en mobile"
          } > "drafts/refresh/${TODAY}-${FILENAME}.md"

          echo "✅ Brief d'actualisation généré : drafts/refresh/${TODAY}-${FILENAME}.md"
          cat "drafts/refresh/${TODAY}-${FILENAME}.md"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(content): brief actualisation ${{ steps.target.outputs.file }}"
          title: "🔄 Actualisation — ${{ steps.target.outputs.file }}"
          body: |
            ## Brief d'actualisation hebdomadaire

            L'article le plus ancien du blog a été identifié pour actualisation.

            ### Article ciblé
            - **Fichier** : `${{ steps.target.outputs.file }}`
            - **Dernière modification** : ${{ steps.target.outputs.last_modified }} (${{ steps.target.outputs.days_old }} jours)
            
            ### Pourquoi actualiser ?
            Google valorise le contenu actualisé. Un article non modifié depuis >14 jours perd progressivement du signal 'freshness'. Cette PR propose un brief d'actualisation.

            ### Workflow
            1. Le brief est dans `drafts/refresh/${{ steps.date.outputs.today }}-*.md`
            2. Copier le brief + contenu actuel de l'article → Claude
            3. Claude propose la version actualisée
            4. Coller le résultat dans l'article cible
            5. Commit + push sur cette PR
            6. Merger la PR quand prêt

            ### Rappel
            - L'Agent 3 mettra à jour `sitemap.xml` automatiquement après merge
            - L'Agent 2 soumettra l'URL mise à jour à Google Indexing API
          branch: content/refresh-${{ steps.date.outputs.today }}
          delete-branch: true
          labels: |
            content
            automated
            needs-refresh
