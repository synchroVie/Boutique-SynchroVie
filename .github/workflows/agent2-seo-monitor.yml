name: Agent 2 — SEO Monitor (sitemap check + rapport)

# Déclencheur : chaque jour à 8h UTC (= 8h Bamako) + manuel
# Version sans OAuth Google (l'utilisateur n'a pas de carte compatible)
# Mode : vérification technique + rapport + demande screenshot GSC hebdo
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set date
        id: date
        run: |
          echo "today=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Check sitemap URLs (HTTP 200)
        id: sitemap
        run: |
          set -e
          # Télécharger le sitemap
          SITEMAP_URL="https://synchrovie.github.io/Boutique-SynchroVie/sitemap.xml"
          curl -s "$SITEMAP_URL" -o /tmp/sitemap.xml

          # Compter et vérifier les URLs
          TOTAL=$(python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('/tmp/sitemap.xml')
          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls = [u.find('sm:loc', ns).text for u in tree.getroot().findall('sm:url', ns)]
          print(len(urls))
          ")

          echo "total_urls=$TOTAL" >> $GITHUB_OUTPUT
          echo "📊 Total URLs dans sitemap: $TOTAL"

          # Vérifier chaque URL
          python3 << 'EOF' > /tmp/url-check-results.txt
          import xml.etree.ElementTree as ET
          import urllib.request, ssl
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          tree = ET.parse('/tmp/sitemap.xml')
          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls = [u.find('sm:loc', ns).text for u in tree.getroot().findall('sm:url', ns)]

          ok = 0
          errors = []
          for url in urls:
              try:
                  req = urllib.request.Request(url, method='HEAD', headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, context=ctx, timeout=15) as r:
                      if r.status == 200:
                          ok += 1
                      else:
                          errors.append(f'[{r.status}] {url}')
              except Exception as e:
                  errors.append(f'[ERR] {url}: {str(e)[:80]}')

          print(f'OK: {ok}/{len(urls)}')
          if errors:
              print('Errors:')
              for e in errors:
                  print(f'  {e}')
          EOF

          cat /tmp/url-check-results.txt

      - name: Ping Google & Bing for sitemap refresh
        run: |
          SITEMAP_URL="https://synchrovie.github.io/Boutique-SynchroVie/sitemap.xml"
          # Google ping (legacy mais encore accepté)
          GOOGLE_PING=$(curl -s -o /dev/null -w "%{http_code}" "https://www.google.com/ping?sitemap=${SITEMAP_URL}")
          # Bing ping
          BING_PING=$(curl -s -o /dev/null -w "%{http_code}" "https://www.bing.com/ping?sitemap=${SITEMAP_URL}")
          echo "Google ping: $GOOGLE_PING"
          echo "Bing ping: $BING_PING"

      - name: Generate SEO report
        run: |
          mkdir -p seo-reports
          DATE="${{ steps.date.outputs.today }}"

          {
            echo "# Rapport SEO Quotidien — SynchroVie"
            echo ""
            echo "**Date** : ${DATE}"
            echo "**Timestamp** : ${{ steps.date.outputs.timestamp }}"
            echo ""
            echo "## État technique du sitemap"
            echo ""
            echo "- Total URLs : ${{ steps.sitemap.outputs.total_urls }}"
            echo "- Vérification HTTP 200 :"
            echo ""
            echo '```'
            cat /tmp/url-check-results.txt
            echo '```'
            echo ""
            echo "## Pings moteurs de recherche"
            echo ""
            echo "- Google sitemap ping envoyé"
            echo "- Bing sitemap ping envoyé"
            echo ""
            echo "## Données GSC (à remplir manuellement par l'utilisateur)"
            echo ""
            echo "> L'utilisateur doit envoyer un screenshot de GSC > Indexation des pages"
            echo "> à l'assistant GLM pour analyse hebdomadaire."
            echo ""
            echo "## Actions recommandées"
            echo ""
            echo "- [ ] Demander indexation manuelle de 10 URLs dans GSC (limite quotidienne)"
            echo "- [ ] Vérifier GSC > Performance > Pays source (France, Mali, etc.)"
            echo "- [ ] Si stagnation > 2 semaines : créer backlinks Medium/Quora"
            echo "- [ ] Vérifier si Google a crawl les dernières modifications (GSC > Couverture)"
          } > "seo-reports/${DATE}.md"

          echo "Rapport généré : seo-reports/${DATE}.md"
          cat "seo-reports/${DATE}.md"

      - name: Commit & Push report
        run: |
          git config user.name "SynchroVie SEO Bot"
          git config user.email "actions@github.com"
          git add seo-reports/
          git diff --staged --quiet && echo "Aucun nouveau rapport" || (
            git commit -m "chore(seo): rapport quotidien ${{ steps.date.outputs.today }}"
            git push
            echo "✅ Rapport poussé"
          )
